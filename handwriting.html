<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Write It!">
  <link rel="manifest" href="manifest.json">
  <title>Write It!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --pink: #ec4899;
      --pink-dark: #be185d;
      --green: #22c55e;
      --green-dark: #15803d;
      --yellow: #fbbf24;
      --ink: #1e1b4b;
    }

    html { font-size: clamp(14px, 2.1vmin, 22px); }

    body {
      font-family: ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Nunito', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      color: var(--ink);
      background: linear-gradient(135deg, #f472b6 0%, #fb923c 100%) fixed;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    button { font: inherit; color: inherit; border: none; cursor: pointer; touch-action: manipulation; }

    .view {
      display: none;
      position: absolute;
      inset: 0;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      flex-direction: column;
      align-items: center;
      gap: 14px;
      overflow-y: auto;
    }
    .view.active { display: flex; }

    /* ── Shared bits ─────────────────────────────── */
    .bar { width: 100%; max-width: 1200px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .bar h1 { flex: 1; color: white; font-size: 2.2rem; text-shadow: 2px 3px 0 rgba(0,0,0,0.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spacer { flex: 1; }

    .round-btn {
      width: 64px; height: 64px; border-radius: 20px; flex-shrink: 0;
      background: rgba(255,255,255,0.92); box-shadow: 0 4px 0 rgba(0,0,0,0.18);
      font-size: 1.9rem; line-height: 1; display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .round-btn:active { transform: translateY(3px); box-shadow: none; }

    .chip {
      min-height: 52px; padding: 0 18px; border-radius: 26px; background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 0 rgba(0,0,0,0.18); display: flex; align-items: center; gap: 6px;
      font-size: 1.6rem; color: var(--pink-dark); flex-shrink: 0;
    }

    svg.glyph { display: block; height: 100%; width: auto; overflow: visible; }

    /* ── Home ────────────────────────────────────── */
    .tabs { display: flex; gap: 10px; width: 100%; max-width: 1000px; flex-shrink: 0; }
    .tab {
      flex: 1; min-height: 64px; border-radius: 20px; font-size: 1.8rem;
      background: rgba(255,255,255,0.35); color: white; box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    }
    .tab.on { background: white; color: var(--pink-dark); box-shadow: 0 4px 0 rgba(0,0,0,0.2); }

    .play {
      flex-shrink: 0; min-height: 96px; padding: 0 44px; border-radius: 48px;
      background: var(--green); color: white; font-size: 3rem;
      box-shadow: 0 7px 0 var(--green-dark); display: flex; align-items: center; gap: 18px;
      animation: bob 1.6s ease-in-out infinite;
    }
    .play:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--green-dark); animation: none; }
    .play .next { height: 72px; background: white; color: var(--ink); border-radius: 18px; padding: 4px 14px; display: flex; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .tiles { width: 100%; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; padding-bottom: 20px; flex-shrink: 0; }
    .tiles.words { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .tile {
      background: white; border-radius: 20px; padding: 8px 6px 6px; min-height: 104px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 2px;
      border: 4px solid transparent; color: var(--ink);
    }
    .tile:active { transform: translateY(3px); box-shadow: none; }
    .tile .g { height: 66px; display: flex; justify-content: center; }
    .tile .st { font-size: 1.05rem; letter-spacing: 1px; color: #d1d5db; line-height: 1; }
    .tile .st b { color: var(--yellow); font-weight: 800; }
    .tile.next { border-color: var(--green); }
    .tile.gold { background: #fffbeb; }

    /* ── Play ────────────────────────────────────── */
    .prompt { height: 64px; padding: 6px 18px; border-radius: 20px; background: white; box-shadow: 0 4px 0 rgba(0,0,0,0.18); display: flex; flex-shrink: 0; }
    .pips { display: flex; gap: 8px; align-items: center; }
    .pip { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .pip.done { background: var(--yellow); }
    .pip.now { background: white; transform: scale(1.25); box-shadow: 0 0 0 4px rgba(255,255,255,0.35); }

    .stage { flex: 1; width: 100%; max-width: 1200px; display: flex; gap: 14px; min-height: 0; }
    .paper {
      flex: 1; position: relative; min-width: 0; min-height: 0; background: #fffdf5; border-radius: 28px;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15); overflow: hidden; touch-action: none;
    }
    .paper canvas.layer { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ink { touch-action: none; cursor: crosshair; }

    .tip {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); pointer-events: none;
      background: rgba(30,27,75,0.92); color: white; padding: 8px 22px; border-radius: 999px;
      font-size: 1.5rem; white-space: nowrap; display: flex; align-items: center; gap: 10px; z-index: 3;
    }
    .tip.pop { animation: pop 0.35s ease-out; }
    .tip.good { background: var(--green-dark); }
    .tip.bad { background: #c2410c; }
    .tip .stars { color: rgba(255,255,255,0.3); letter-spacing: 2px; font-size: 1.8rem; line-height: 1; }
    .tip .stars b { color: var(--yellow); display: inline-block; animation: starPop 0.4s ease-out backwards; }
    .tip .stars b:nth-child(2) { animation-delay: 0.15s; }
    .tip .stars b:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pop { 0% { transform: translateX(-50%) scale(0.7); } 60% { transform: translateX(-50%) scale(1.12); } 100% { transform: translateX(-50%) scale(1); } }
    @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.5) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }

    .model {
      position: absolute; top: 12px; right: 12px; z-index: 3; padding: 0; overflow: hidden;
      border-radius: 18px; background: white; border: 4px solid #f9a8d4; box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      display: none;
    }
    .model.on { display: block; }
    .model canvas { display: block; }

    .tools { display: flex; flex-direction: column; gap: 16px; justify-content: center; flex-shrink: 0; }
    .tool {
      width: 88px; height: 88px; border-radius: 26px; font-size: 2.5rem; line-height: 1;
      background: white; box-shadow: 0 5px 0 rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .tool:active { transform: translateY(4px); box-shadow: none; }
    .tool.go { background: var(--green); color: white; box-shadow: 0 5px 0 var(--green-dark); height: 110px; font-size: 3.2rem; }
    .tool.pulse { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }

    @media (orientation: portrait) {
      .stage { flex-direction: column; }
      .tools { flex-direction: row; }
      .tool.go { height: 88px; width: 130px; }
    }

    /* ── Round end ───────────────────────────────── */
    .end-card {
      margin: auto; background: white; border-radius: 32px; padding: 26px 30px; width: 100%; max-width: 900px;
      box-shadow: 0 10px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 16px; flex-shrink: 0;
    }
    .end-card .big { font-size: 4.4rem; line-height: 1; animation: bob 1.4s ease-in-out infinite; }
    .end-card .sum { font-size: 2.6rem; color: var(--pink-dark); }
    .thumbs { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .thumb { background: #fffdf5; border: 3px solid #fde68a; border-radius: 18px; padding: 6px 6px 8px; display: flex; flex-direction: column; align-items: center; }
    .thumb canvas { display: block; }
    .thumb .st { font-size: 1.3rem; color: #d1d5db; letter-spacing: 2px; line-height: 1; }
    .thumb .st b { color: var(--yellow); }
    .end-btns { display: flex; gap: 18px; align-items: center; }
    .end-btns .tool { background: #f3f4f6; }
    .end-btns .tool.go { background: var(--green); width: 170px; }
    .end-btns .tool span { font-size: 1.2rem; }

    .confetti { position: fixed; width: 12px; height: 12px; border-radius: 3px; pointer-events: none; z-index: 9000; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(900deg); opacity: 0; } }
  </style>
</head>
<body>

  <!-- Home: pick a set, press play (or tap any letter to practise just that one) -->
  <div class="view active" id="v-home">
    <div class="bar">
      <a class="round-btn" href="index.html" aria-label="All games">🏠</a>
      <h1>✏️ Write It!</h1>
      <div class="chip" aria-label="Stars">⭐ <span id="starTotal">0</span></div>
      <button class="round-btn" id="muteBtn" aria-label="Sound">🔊</button>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-tab="abc">abc</button>
      <button class="tab" data-tab="ABC">ABC</button>
      <button class="tab" data-tab="123">123</button>
      <button class="tab" data-tab="words">words</button>
    </div>
    <button class="play" id="playBtn" aria-label="Play">▶ <span class="next" id="playNext"></span></button>
    <div class="tiles" id="tiles"></div>
  </div>

  <!-- Play: one letter, number or word at a time on handwriting lines -->
  <div class="view" id="v-play">
    <div class="bar">
      <button class="round-btn" id="quitBtn" aria-label="Stop">✕</button>
      <div class="prompt" id="prompt"></div>
      <div class="pips" id="pips"></div>
      <div class="spacer"></div>
      <div class="chip" id="roundChip"></div>
      <div class="chip">⭐ <span id="roundStars">0</span></div>
    </div>
    <div class="stage">
      <div class="paper" id="paper">
        <canvas class="layer" id="bg"></canvas>
        <canvas class="layer" id="fx"></canvas>
        <canvas class="layer" id="ink"></canvas>
        <div class="tip" id="tip"></div>
        <button class="model" id="model" aria-label="Watch again"><canvas id="modelCv"></canvas></button>
      </div>
      <div class="tools" id="tools"></div>
    </div>
  </div>

  <!-- Round end: what he wrote, with stars -->
  <div class="view" id="v-end">
    <div class="end-card">
      <div class="big" id="endEmoji">🎉</div>
      <div class="sum">+<span id="endStars">0</span> ⭐</div>
      <div class="thumbs" id="thumbs"></div>
      <div class="end-btns">
        <button class="tool" id="endHome" aria-label="Home">🏠</button>
        <button class="tool go" id="endAgain" aria-label="Play again">▶</button>
        <button class="tool" id="shareBtn" aria-label="Show Dad" style="display:none">📤<span>Dad</span></button>
      </div>
    </div>
  </div>

<script src="voice-clips.js"></script>
<script src="photo-pack.js"></script>
<script src="voice-bank.js"></script>
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const SAVE_KEY = 'handwriting-v1';

  // ── Letter shapes ──────────────────────────────────────────────────────────
  // Every glyph is a list of pencil strokes in the order (and direction) they are
  // taught. Units: 1 = the gap between two handwriting lines.
  //   y = 0 sky line · 1 plane line (dashed) · 2 grass line · 3 worm line
  // Commands:  M x,y  start      L x,y  straight line      D x,y  a dot
  //            A cx,cy,rx,ry,a0,a1  part of an oval, a0 → a1 in degrees
  //              (0 = right, 90 = bottom, 180 = left, −90 = top; going down in
  //               number is counter-clockwise — the "magic c" direction)
  //            C x1,y1,x2,y2,x,y  curve
  const GLYPHS = {
    a: ['A.45,1.5,.45,.5,-40,-360 L.9,1 L.9,2'],
    b: ['M0,0 L0,2 L0,1.5 A.45,1.5,.45,.5,180,520'],
    c: ['A.45,1.5,.45,.5,-40,-320'],
    d: ['A.45,1.5,.45,.5,-40,-360 L.9,0 L.9,2'],
    e: ['M.05,1.5 L.9,1.5 A.45,1.5,.45,.5,0,-315'],
    f: ['A.45,.3,.25,.3,-20,-180 L.2,2', 'M0,1 L.55,1'],
    g: ['A.45,1.5,.45,.5,-40,-360 L.9,1 L.9,2.6 A.5,2.6,.4,.4,0,160'],
    h: ['M0,0 L0,2 L0,1.4 A.4,1.4,.4,.4,180,360 L.8,2'],
    i: ['M0,1 L0,2', 'D0,.55'],
    j: ['M.55,1 L.55,2.6 A.25,2.6,.3,.38,0,150', 'D.55,.55'],
    k: ['M0,0 L0,2', 'M.7,1 L0,1.55 L.75,2'],
    l: ['M0,0 L0,2'],
    m: ['M0,1 L0,2 L0,1.36 A.35,1.36,.35,.36,180,360 L.7,2 L.7,1.36 A1.05,1.36,.35,.36,180,360 L1.4,2'],
    n: ['M0,1 L0,2 L0,1.42 A.4,1.42,.4,.42,180,360 L.8,2'],
    o: ['A.45,1.5,.45,.5,-60,-420'],
    p: ['M0,1 L0,3 L0,1.5 A.45,1.5,.45,.5,180,520'],
    q: ['A.45,1.5,.45,.5,-40,-360 L.9,1 L.9,3'],
    r: ['M0,1 L0,2 L0,1.42 A.38,1.42,.38,.42,180,310'],
    s: ['A.38,1.25,.33,.25,-30,-270 A.38,1.75,.35,.25,-90,150'],
    t: ['M.3,0 L.3,2', 'M0,1 L.6,1'],
    u: ['M0,1 L0,1.6 A.4,1.6,.4,.4,180,0 L.8,1 L.8,2'],
    v: ['M0,1 L.4,2 L.8,1'],
    w: ['M0,1 L.3,2 L.6,1 L.9,2 L1.2,1'],
    x: ['M0,1 L.75,2', 'M.75,1 L0,2'],
    y: ['M0,1 L.4,2', 'M.8,1 L0,3'],
    z: ['M0,1 L.75,1 L0,2 L.75,2'],

    A: ['M.6,0 L0,2', 'M.6,0 L1.2,2', 'M.25,1.25 L.95,1.25'],
    B: ['M0,0 L0,2', 'M0,0 L.4,0 A.4,.5,.45,.5,-90,90 L0,1 L.45,1 A.45,1.5,.5,.5,-90,90 L0,2'],
    C: ['A.75,1,.75,1,-45,-315'],
    D: ['M0,0 L0,2', 'M0,0 L.3,0 A.3,1,.8,1,-90,90 L0,2'],
    E: ['M0,0 L0,2', 'M0,0 L.9,0', 'M0,1 L.7,1', 'M0,2 L.9,2'],
    F: ['M0,0 L0,2', 'M0,0 L.9,0', 'M0,1 L.7,1'],
    G: ['A.75,1,.75,1,-45,-360 L.8,1'],
    H: ['M0,0 L0,2', 'M1.1,0 L1.1,2', 'M0,1 L1.1,1'],
    I: ['M.4,0 L.4,2', 'M0,0 L.8,0', 'M0,2 L.8,2'],
    J: ['M.8,0 L.8,1.5 A.4,1.5,.4,.5,0,170'],
    K: ['M0,0 L0,2', 'M1,0 L0,1.1 L1.05,2'],
    L: ['M0,0 L0,2 L.9,2'],
    M: ['M0,0 L0,2', 'M0,0 L.7,2 L1.4,0 L1.4,2'],
    N: ['M0,0 L0,2', 'M0,0 L1.1,2 L1.1,0'],
    O: ['A.8,1,.8,1,-60,-420'],
    P: ['M0,0 L0,2', 'M0,0 L.45,0 A.45,.5,.45,.5,-90,90 L0,1'],
    Q: ['A.8,1,.8,1,-60,-420', 'M1,1.4 L1.6,2.1'],
    R: ['M0,0 L0,2', 'M0,0 L.45,0 A.45,.5,.45,.5,-90,90 L0,1 L.95,2'],
    S: ['A.55,.5,.5,.5,-30,-270 A.55,1.5,.55,.5,-90,150'],
    T: ['M.6,0 L.6,2', 'M0,0 L1.2,0'],
    U: ['M0,0 L0,1.4 A.55,1.4,.55,.6,180,0 L1.1,0'],
    V: ['M0,0 L.6,2 L1.2,0'],
    W: ['M0,0 L.4,2 L.8,0 L1.2,2 L1.6,0'],
    X: ['M0,0 L1.1,2', 'M1.1,0 L0,2'],
    Y: ['M0,0 L.6,1', 'M1.2,0 L.6,1 L.6,2'],
    Z: ['M0,0 L1.1,0 L0,2 L1.1,2'],

    0: ['A.55,1,.55,1,-90,-450'],
    1: ['M0,0 L0,2'],
    2: ['A.5,.5,.5,.5,200,400 L0,2 L1.05,2'],
    3: ['A.45,.5,.45,.5,210,450 A.45,1.5,.5,.5,-90,150'],
    4: ['M0,0 L0,1.15 L1,1.15', 'M.8,0 L.8,2'],
    5: ['M.25,0 L.25,.86 A.5,1.4,.6,.6,-115,150', 'M.25,0 L1,0'],
    6: ['M.85,0 C.3,.3,0,1,.05,1.45 A.5,1.45,.45,.55,180,-180'],
    7: ['M0,0 L1,0 L.35,2'],
    8: ['A.5,.5,.42,.5,-40,-270 A.5,1.5,.5,.5,-90,270 A.5,.5,.42,.5,90,-40'],
    9: ['A.45,.55,.45,.55,0,-360 L.9,2'],
  };

  // Home screen order (easy to find) vs. teaching order (similar strokes together,
  // easiest first) — the Play button walks the teaching order
  const SHOW = {
    abc: 'abcdefghijklmnopqrstuvwxyz'.split(''),
    ABC: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
    123: '0123456789'.split(''),
    // a few names, a few of his red words, a few that are just fun to write
    words: ['Leon', 'Dad', 'Mom', 'the', 'and', 'is', 'to', 'my', 'of', 'you', 'was', 'she', 'cat', 'dog', 'sun', 'fun'],
  };
  const ORDER = {
    abc: 'coadglituesrnmhbpvwkyjfxzq'.split(''),
    ABC: 'LFEHTIUCOQGSJDPBRKAVMNWXYZ'.split(''),
    123: '1470692358'.split(''),
    words: SHOW.words,
  };
  const TABS = ['abc', 'ABC', '123', 'words'];

  // ── Geometry ───────────────────────────────────────────────────────────────
  const STEP = 0.03;        // spacing of sampled points along every path
  const LETTER_GAP = 0.3;   // space between letters in a word
  const DOT_WEIGHT = 12;    // a dot (on i, j) counts like this many path points

  // Walk a polyline and return points an even STEP apart
  function resample(pts, step) {
    if (pts.length < 2) return pts.map(p => [p[0], p[1]]);
    const out = [[pts[0][0], pts[0][1]]];
    let carry = 0;
    for (let i = 1; i < pts.length; i++) {
      let ax = pts[i - 1][0], ay = pts[i - 1][1];
      const bx = pts[i][0], by = pts[i][1];
      let seg = Math.hypot(bx - ax, by - ay);
      while (seg > 0 && carry + seg >= step) {
        const f = (step - carry) / seg;
        ax += (bx - ax) * f; ay += (by - ay) * f;
        out.push([ax, ay]);
        seg = Math.hypot(bx - ax, by - ay);
        carry = 0;
      }
      carry += seg;
    }
    const last = pts[pts.length - 1], o = out[out.length - 1];
    if (Math.hypot(last[0] - o[0], last[1] - o[1]) > step * 0.3) out.push([last[0], last[1]]);
    return out;
  }

  function parseStroke(str) {
    const pts = [];
    let cur = null, dot = false, m;
    const re = /([MLACD])([^MLACD]*)/g;
    while ((m = re.exec(str))) {
      const n = m[2].trim().split(/[\s,]+/).filter(Boolean).map(Number);
      const cmd = m[1];
      if (cmd === 'D') { dot = true; pts.push([n[0], n[1]]); }
      else if (cmd === 'M' || cmd === 'L') { cur = [n[0], n[1]]; pts.push(cur); }
      else if (cmd === 'A') {
        const steps = Math.max(8, Math.ceil(Math.abs(n[5] - n[4]) / 5));
        for (let k = 0; k <= steps; k++) {
          const a = (n[4] + (n[5] - n[4]) * k / steps) * Math.PI / 180;
          cur = [n[0] + n[2] * Math.cos(a), n[1] + n[3] * Math.sin(a)];
          pts.push(cur);
        }
      } else if (cmd === 'C') {
        const p0 = cur;
        for (let k = 1; k <= 24; k++) {
          const t = k / 24, u = 1 - t;
          cur = [
            u * u * u * p0[0] + 3 * u * u * t * n[0] + 3 * u * t * t * n[2] + t * t * t * n[4],
            u * u * u * p0[1] + 3 * u * u * t * n[1] + 3 * u * t * t * n[3] + t * t * t * n[5],
          ];
          pts.push(cur);
        }
      }
    }
    return { dot: dot, pts: dot ? pts : resample(pts, STEP) };
  }

  const RAW = {};
  function rawGlyph(ch) {
    if (RAW[ch]) return RAW[ch];
    const strokes = GLYPHS[ch].map(parseStroke);
    let minX = Infinity, maxX = -Infinity;
    strokes.forEach(s => s.pts.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); }));
    return (RAW[ch] = { strokes: strokes, minX: minX, w: maxX - minX });
  }

  // A template is what gets drawn, demonstrated and scored: one glyph, or a word
  // laid out letter by letter. Flat arrays (tx, ty…) make scoring quick.
  const TPL = {};
  function tpl(key) {
    if (TPL[key]) return TPL[key];
    const chars = key.length > 1 ? key.split('') : [key];
    const strokes = [];
    let x = 0;
    chars.forEach(ch => {
      const g = rawGlyph(ch);
      g.strokes.forEach(s => {
        const pts = s.pts.map(p => [p[0] - g.minX + x, p[1]]);
        strokes.push({ pts: pts, dot: s.dot, len: s.dot ? 0 : (pts.length - 1) * STEP });
      });
      x += g.w + LETTER_GAP;
    });
    const t = { key: key, strokes: strokes, w: x - LETTER_GAP, isWord: chars.length > 1, tx: [], ty: [], ts: [], tw: [], tk: [], wsum: 0, len: 0, maxY: 0 };
    strokes.forEach((s, i) => {
      t.len += s.len;
      s.pts.forEach(p => {
        t.tx.push(p[0]); t.ty.push(p[1]); t.ts.push(i);
        t.tw.push(s.dot ? DOT_WEIGHT : 1);
        t.tk.push(s.dot ? 1.6 : 1);          // dots are allowed to land a bit further off
        t.wsum += s.dot ? DOT_WEIGHT : 1;
        t.maxY = Math.max(t.maxY, p[1]);
      });
    });
    // Demo timeline: each stroke drawn at a steady pace with a pause to lift the pencil
    let at = 0;
    t.plan = strokes.map(s => {
      const seg = { t0: at, d: s.dot ? 280 : Math.max(420, s.len / 1.9 * 1000) };
      at += seg.d + 340;
      return seg;
    });
    t.planEnd = at - 340;
    return (TPL[key] = t);
  }

  // The same shapes as crisp SVG for buttons and tiles, so what he taps looks
  // exactly like what he will write (system fonts draw a and g differently)
  function glyphSvg(key, deep) {
    const t = tpl(key);
    const h = deep ? 3.3 : 2.3;
    let s = '<svg class="glyph" viewBox="-0.2 -0.15 ' + (Math.max(t.w, 0.1) + 0.4).toFixed(2) + ' ' + h + '" aria-hidden="true">';
    t.strokes.forEach(st => {
      if (st.dot) { s += '<circle cx="' + st.pts[0][0].toFixed(2) + '" cy="' + st.pts[0][1].toFixed(2) + '" r="0.11" fill="currentColor"/>'; return; }
      const pts = st.pts.filter((p, i) => i % 2 === 0 || i === st.pts.length - 1).map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
      s += '<polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="0.17" stroke-linecap="round" stroke-linejoin="round"/>';
    });
    return s + '</svg>';
  }

  // ── Scoring ────────────────────────────────────────────────────────────────
  // Three questions, in a first grader's terms:
  //   cov   did you write the whole letter?        (share of the path with ink on it)
  //   prec  did you stay on the path?              (share of the ink that is on the path)
  //   form  did you start at the dot, go the right way, in the right order?
  // Trace mode expects ink on the grey road; with the road gone the tolerance widens,
  // and on blank lines the letter may sit anywhere along the line.
  const TOL = { trace: 0.17, dots: 0.22, solo: 0.21 };
  const START_R = { trace: 0.34, dots: 0.38, solo: 0.44 };
  // [coverage, precision] needed for 1, 2 and 3 stars
  const TH = {
    trace: [[0.80, 0.60], [0.90, 0.78], [0.95, 0.88]],
    dots:  [[0.75, 0.55], [0.87, 0.72], [0.93, 0.84]],
    solo:  [[0.72, 0.50], [0.84, 0.68], [0.90, 0.80]],
  };

  function overlap(t, ux, uy, tol, dx, dy) {
    const nT = t.tx.length, nU = ux.length;
    const hit = new Uint8Array(nT), on = new Uint8Array(nU);
    let hw = 0, onN = 0;
    for (let i = 0; i < nT; i++) {
      const r = tol * t.tk[i], r2 = r * r, x = t.tx[i] + dx, y = t.ty[i] + dy;
      let h = 0;
      for (let j = 0; j < nU; j++) {
        const ax = ux[j] - x, ay = uy[j] - y;
        if (ax * ax + ay * ay <= r2) { h = 1; on[j] = 1; }
      }
      if (h) { hit[i] = 1; hw += t.tw[i]; }
    }
    for (let j = 0; j < nU; j++) onN += on[j];
    return { cov: hw / t.wsum, prec: nU ? onN / nU : 0, hit: hit, on: on };
  }

  const at = (pts, f) => pts[Math.round(f * (pts.length - 1))];

  // Pair each taught stroke with the pencil stroke that best follows it, then ask:
  // same start, same direction, same order?
  function formation(t, U, dx, dy, mode) {
    const M = [];
    U.forEach(s => {
      if (!s.length) return;
      const q = s.map(p => [p[0] - dx, p[1] - dy]);
      const last = M[M.length - 1];
      // a tiny lift in the middle of a line still counts as one stroke
      if (last && last.length > 4 && q.length > 4 && dist(last[last.length - 1], q[0]) < 0.14) { M[M.length - 1] = last.concat(q); return; }
      M.push(q);
    });
    const n = t.strokes.length, pairs = [];
    t.strokes.forEach((s, i) => M.forEach((q, j) => {
      const qlen = (q.length - 1) * STEP;
      if (s.dot) {
        if (qlen > 0.45) return;
        let cx = 0, cy = 0;
        q.forEach(p => { cx += p[0]; cy += p[1]; });
        const d = dist([cx / q.length, cy / q.length], s.pts[0]);
        if (d < 0.5) pairs.push({ i: i, j: j, c: d, ok: true });
        return;
      }
      if (qlen < s.len * 0.35 || qlen > s.len * 2.2) return;
      let dF = 0, dR = 0;
      for (let k = 0; k <= 8; k++) {
        const a = at(s.pts, k / 8);
        dF += dist(a, at(q, k / 8));
        dR += dist(a, at(q, 1 - k / 8));
      }
      dF /= 9; dR /= 9;
      const backwards = dR + 0.03 < dF;
      pairs.push({ i: i, j: j, c: Math.min(dF, dR), ok: !backwards && dist(s.pts[0], q[0]) < START_R[mode] });
    }));
    pairs.sort((a, b) => a.c - b.c);
    const got = new Array(n).fill(null), used = {};
    for (const p of pairs) {
      if (p.c > 0.5) break;
      if (got[p.i] || used[p.j]) continue;
      got[p.i] = p; used[p.j] = true;
    }
    let ok = 0, bad = 0, missing = 0, lastJ = -1, inOrder = true;
    got.forEach(p => {
      if (!p) { missing++; return; }
      if (p.ok) ok++; else bad++;
      if (p.j < lastJ) inOrder = false;
      lastJ = p.j;
    });
    let score = ok / n;
    if (!inOrder) score = Math.min(score, 0.5);
    return { score: score, issue: bad ? 'start' : (!inOrder || missing) ? 'order' : null };
  }

  function judge(t, ink, mode) {
    const U = ink.map(s => resample(s, STEP));
    const ux = [], uy = [];
    U.forEach(s => s.forEach(p => { ux.push(p[0]); uy.push(p[1]); }));
    if (!ux.length) return { stars: 0, empty: true };

    // On blank lines the letter can sit anywhere along the line (and a touch high
    // or low): slide the model over the ink and keep the best fit
    let cands = [[0, 0]];
    if (mode === 'solo') {
      let lo = Infinity, hi = -Infinity;
      ux.forEach(x => { lo = Math.min(lo, x); hi = Math.max(hi, x); });
      const cx = (lo + hi) / 2 - t.w / 2;
      cands = [];
      for (let k = -5; k <= 5; k++) for (const dy of [-0.1, -0.05, 0, 0.05, 0.1]) cands.push([cx + k * 0.06, dy]);
    }
    let best = null;
    for (const c of cands) {
      const o = overlap(t, ux, uy, TOL[mode], c[0], c[1]);
      o.q = o.cov + o.prec - Math.abs(c[1]) * 0.3;
      if (!best || o.q > best.q) { best = o; best.dx = c[0]; best.dy = c[1]; }
    }

    const form = formation(t, U, best.dx, best.dy, mode);
    const th = TH[mode];
    let stars = 0;
    for (let k = 0; k < 3; k++) if (stars === k && best.cov >= th[k][0] && best.prec >= th[k][1]) stars = k + 1;
    if (stars === 3 && form.score < 1) stars = 2;

    let hint = null;
    if (!stars) hint = (best.cov < th[0][0] && ux.length * STEP < t.len * 1.25) ? 'finish' : 'messy';
    else if (form.score < 1) hint = form.issue;

    return { stars: stars, cov: best.cov, prec: best.prec, form: form.score, hint: hint, hit: best.hit, on: best.on, U: U, dx: best.dx, dy: best.dy };
  }

  // ── Saved progress ─────────────────────────────────────────────────────────
  // g[key]: best = most stars earned on its last step (3 = known), n = times, t = last time
  let S = { g: {}, stars: 0, muted: false, tab: 'abc', rounds: 0 };
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) S = Object.assign(S, JSON.parse(raw));
    } catch (e) {}
    if (TABS.indexOf(S.tab) === -1) S.tab = 'abc';
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  const rec = (key) => S.g[key] || { best: 0, n: 0, t: 0 };

  // ── Sound ──────────────────────────────────────────────────────────────────
  let actx = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, when, dur, type, vol) {
    if (S.muted) return;
    const c = audio();
    if (!c) return;
    try {
      const o = c.createOscillator(), g = c.createGain();
      const t0 = c.currentTime + (when || 0);
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  const sfx = {
    tap: () => tone(520, 0, 0.07, 'triangle', 0.08),
    ok: () => { tone(587, 0, 0.14); tone(784, 0.1, 0.2); },
    good: () => { tone(659, 0, 0.14); tone(880, 0.1, 0.22); },
    great: () => { tone(659, 0, 0.12); tone(784, 0.09, 0.12); tone(1047, 0.18, 0.3); },
    oops: () => { tone(300, 0, 0.16, 'triangle', 0.12); tone(240, 0.12, 0.22, 'triangle', 0.12); },
    fanfare: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, 'triangle', 0.16)),
  };

  // Dad's voice is an optional extra: if the voice bank is missing or an older
  // copy is cached, everything below quietly does nothing
  const VB = window.VoiceBank || {};
  if (VB.configure) VB.configure({ getContext: () => audio(), isMuted: () => S.muted });
  function say(slots, delay, opts) {
    if (!VB.play) return false;
    for (const s of [].concat(slots)) if (s && VB.play(s, delay, opts)) return true;
    return false;
  }
  const hush = () => { if (VB.stop) VB.stop(); };

  function confetti(bursts) {
    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];
    for (let n = 0; n < (bursts || 1); n++) {
      setTimeout(() => {
        for (let i = 0; i < 24; i++) {
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.cssText = 'left:' + (Math.random() * 100) + 'vw;top:-15px;background:' + pick(colors) +
            ';animation-duration:' + (1 + Math.random() * 1.2) + 's;animation-delay:' + (Math.random() * 0.4) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 2400);
        }
      }, n * 320);
    }
  }

  // ── Views ──────────────────────────────────────────────────────────────────
  let view = 'home';
  let raf = 0;
  function show(name) {
    view = name;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + name));
    if (name === 'play' && !raf) raf = requestAnimationFrame(tick);
  }
  const starsHtml = (n) => '<b>★</b>'.repeat(n) + '☆'.repeat(3 - n);

  // ── Home ───────────────────────────────────────────────────────────────────
  // Next up: the first one in teaching order that still needs work
  function nextKey(tab) {
    const order = ORDER[tab];
    return order.find(k => rec(k).best < 3) || order.slice().sort((a, b) => rec(a).t - rec(b).t)[0];
  }

  function renderHome() {
    const tab = S.tab, deep = tab === 'abc' || tab === 'words', next = nextKey(tab);
    $('starTotal').textContent = S.stars;
    $('muteBtn').textContent = S.muted ? '🔇' : '🔊';
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('playNext').innerHTML = glyphSvg(next, deep);
    const tiles = $('tiles');
    tiles.className = 'tiles' + (tab === 'words' ? ' words' : '');
    tiles.innerHTML = SHOW[tab].map(k => {
      const b = rec(k).best;
      return '<button class="tile' + (k === next ? ' next' : '') + (b === 3 ? ' gold' : '') + '" data-key="' + k + '" aria-label="' + k + ', ' + b + ' of 3 stars">' +
        '<span class="g">' + glyphSvg(k, deep) + '</span><span class="st">' + starsHtml(b) + '</span></button>';
    }).join('');
  }
  function goHome() {
    hush();
    renderHome();
    show('home');
  }

  // ── Rounds ─────────────────────────────────────────────────────────────────
  // A round is a few letters. A new letter climbs three steps — trace the road,
  // then just the start dots, then on his own. Only a letter he has written with
  // three stars (right shape AND right strokes, no road) counts as known and goes
  // straight to the last step: two stars can hide a backwards habit.
  // Words stop at the dots (their spacing is the hard part).
  let R = null;     // the round: items, where we are, stars so far
  let cur = null;   // the step on the paper right now

  function stepsFor(key, full) {
    const known = !full && rec(key).best === 3;
    if (key.length > 1) return known ? ['dots'] : ['trace', 'dots'];
    return known ? ['solo'] : ['trace', 'dots', 'solo'];
  }

  function buildRound(tab) {
    const order = ORDER[tab], size = tab === 'words' ? 3 : 4;
    const oldest = (a, b) => rec(a).t - rec(b).t;
    const learning = order.filter(k => rec(k).best < 3);
    const review = order.filter(k => rec(k).best === 3).sort(oldest);
    const keys = [];
    if (review.length && learning.length) keys.push(review.shift());      // warm up with one he knows
    learning.slice(0, 2).forEach(k => { if (keys.length < size) keys.push(k); });   // two new ones is plenty for a sitting
    review.forEach(k => { if (keys.length < size) keys.push(k); });       // early rounds are short: nothing to review yet
    return keys;
  }

  function startRound(keys, full) {
    R = { items: keys.map(k => ({ key: k, steps: stepsFor(k, full), si: 0, result: null })), i: 0, stars: 0, streak: 0, tab: S.tab, single: !!full };
    audio();
    show('play');
    startStep();
    say('roundstart', 350);
  }

  function startStep() {
    const it = R.items[R.i];
    cur = { it: it, key: it.key, t: tpl(it.key), mode: it.steps[it.si], ink: [], state: 'writing', help: false, fails: 0, demo: null, mdemo: null, judged: null, done: 0, t0: performance.now() };
    renderBar();
    resetAttempt();
  }

  // Fresh paper for the same step (first go, or trying again)
  function resetAttempt() {
    clearTimeout(autoTimer);
    activeId = null; stroke = null;
    cur.ink = []; cur.judged = null; cur.state = 'writing'; cur.done = 0;
    $('model').classList.toggle('on', cur.mode !== 'trace');
    renderTools();                                     // before measuring: the buttons take room from the paper
    setTip(cur.mode === 'trace' ? '✏️ Trace it!' : cur.mode === 'dots' ? '🟢 Start at the dot!' : '⭐ Your turn!');
    repaint();
    playDemo(500);
  }

  function renderBar() {
    const it = cur.it;
    $('prompt').innerHTML = glyphSvg(cur.key, cur.t.maxY > 2.1);
    $('pips').innerHTML = it.steps.map((s, i) => '<span class="pip' + (i < it.si ? ' done' : i === it.si ? ' now' : '') + '"></span>').join('');
    $('roundChip').textContent = (R.i + 1) + ' / ' + R.items.length;
    $('roundChip').style.display = R.items.length > 1 ? '' : 'none';
    $('roundStars').textContent = R.stars;
  }

  function setTip(html, cls) {
    const tip = $('tip');
    tip.className = 'tip' + (cls ? ' ' + cls : '');
    tip.innerHTML = html;
    if (cls) { void tip.offsetWidth; tip.classList.add('pop'); }
  }

  function renderTools() {
    const b = (act, icon, label, cls) => '<button class="tool' + (cls ? ' ' + cls : '') + '" data-act="' + act + '" aria-label="' + label + '">' + icon + '</button>';
    let h;
    if (cur.state === 'writing') h = b('watch', '👀', 'Watch') + b('clear', '🧽', 'Erase') + b('check', '✓', 'Check', 'go');
    else if (cur.state === 'passed') h = cur.judged && cur.judged.hint
      ? b('retry', '🔄', 'Again', 'pulse') + b('next', '➜', 'Next', 'go')      // strokes were off: nudge one more go
      : b('retry', '🔄', 'Again') + b('next', '➜', 'Next', 'go pulse');
    else h = b('watch', '👀', 'Watch') + b('retry', '🔄', 'Try again', 'go pulse') + (cur.fails >= 3 ? b('next', '➜', 'Skip') : '');
    $('tools').innerHTML = h;
  }

  // Show how it's written: on the paper while the road is there, otherwise in
  // the little model card so the lines stay his
  function playDemo(delay) {
    const t0 = performance.now() + (delay || 0);
    if (cur.mode === 'trace' || cur.help) { cur.demo = { t0: t0 }; cur.mdemo = null; }
    else { cur.mdemo = { t0: t0 }; cur.demo = null; }
  }

  const NEXT_MS = 2200;
  const MSG = {
    3: ['Perfect!', 'Wow!', 'Super!'], 2: ['Great!', 'Nice!'], 1: ['Good!', 'Got it!'],
    finish: '✏️ Finish it!', road: '🛣️ Stay on the road!',
    start: '🟢 Start at the dot!', order: '👀 Watch how!',
  };

  function check() {
    clearTimeout(autoTimer);
    if (!cur || cur.state !== 'writing' || activeId !== null) return;
    const res = judge(cur.t, cur.ink, cur.mode);
    if (res.empty) { setTip('✏️ Write it!', 'bad'); sfx.tap(); return; }
    if (cur.help && res.stars > 2) res.stars = 2;        // top marks are for doing it without the road
    cur.judged = res;
    cur.demo = null;
    redrawInk();
    if (res.stars) pass(res); else fail(res);
    renderTools();
  }

  function pass(res) {
    const it = cur.it, last = it.si === it.steps.length - 1;
    cur.state = 'passed';
    S.stars += res.stars; R.stars += res.stars;
    // keep what he wrote (slid back onto the model's spot) for the end screen
    it.result = { stars: res.stars, ink: res.U.map(s => s.map(p => [p[0] - res.dx, p[1] - res.dy])) };
    if (last) {
      const r = S.g[cur.key] || (S.g[cur.key] = { best: 0, n: 0, t: 0 });
      r.best = Math.max(r.best, res.stars); r.n++; r.t = Date.now();
    }
    save();
    $('roundStars').textContent = R.stars;

    let hint = res.hint;
    if (hint === 'start' && cur.mode === 'solo' && !cur.help) hint = 'order';
    setTip('<span class="stars">' + starsHtml(res.stars) + '</span>' + (hint ? MSG[hint] : pick(MSG[res.stars])), 'good');
    if (hint) playDemo(700);

    if (res.stars === 3) { sfx.great(); confetti(1); R.streak++; } else { (res.stars === 2 ? sfx.good : sfx.ok)(); R.streak = 0; }
    if (hint) say('showme', 300);                        // "Watch — I'll show you" as the demo replays
    else if (cur.fails) say(['comeback', 'correct'], 300);
    else if (R.streak >= 3 && R.streak % 3 === 0) say(['streak', 'correct'], 300);
    else if (res.stars === 3) say('correct', 300);

    // Three stars: nothing left to fix, so move on by itself after the cheer.
    // Fewer stars wait for him — "Again" is worth a go.
    if (res.stars === 3) autoTimer = setTimeout(() => { if (cur && cur.state === 'passed') next(); }, NEXT_MS);
  }

  function fail(res) {
    cur.state = 'failed';
    cur.fails++;
    R.streak = 0;
    if (cur.mode !== 'trace') cur.help = true;           // bring the grey road back for the next try
    setTip(res.hint === 'finish' ? MSG.finish : MSG.road, 'bad');
    sfx.oops();
    say(cur.fails > 1 ? ['showme', 'encourage'] : ['encourage', 'showme'], 400);
    playDemo(900);
  }

  function next() {
    clearTimeout(autoTimer);
    const it = cur.it;
    if (it.si < it.steps.length - 1) { it.si++; startStep(); return; }
    R.i++;
    if (R.i >= R.items.length) { endRound(); return; }
    startStep();
    if (R.i === R.items.length - 1 && R.items.length > 2) say('lastone', 300);
  }

  // ── Paper: layout and drawing ──────────────────────────────────────────────
  // Three stacked canvases: bg = lines and the grey road, fx = start dots, demo
  // and "you missed this bit" (animated), ink = what he writes
  const paper = $('paper'), bgCv = $('bg'), fxCv = $('fx'), inkCv = $('ink'), modelCv = $('modelCv');
  let bctx, fctx, ictx, mctx;
  const L = { W: 0, H: 0, u: 100, ox: 0, oy: 0, left: 0, top: 0, dpr: 1 };
  const SCALE = { trace: 1, dots: 0.86, solo: 0.72 };    // letters shrink as the help fades
  const GUIDE_W = 0.24;
  const INK = '#1e1b4b';
  const MODEL_H = 118;

  function prep(cv, w, h) {
    cv.width = Math.round(w * L.dpr); cv.height = Math.round(h * L.dpr);
    const c = cv.getContext('2d');
    c.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    c.lineCap = 'round'; c.lineJoin = 'round';
    return c;
  }

  function layout() {
    const r = paper.getBoundingClientRect();
    L.W = r.width; L.H = r.height; L.left = r.left; L.top = r.top;
    L.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    bctx = prep(bgCv, L.W, L.H); fctx = prep(fxCv, L.W, L.H); ictx = prep(inkCv, L.W, L.H);
    const t = cur.t;
    L.u = Math.min(L.H / 3.9, 132, (L.W - 120) / Math.max(t.w, 0.3)) * SCALE[cur.mode];
    L.ox = (L.W - t.w * L.u) / 2;
    L.oy = (L.H - 3 * L.u) / 2 + L.u * 0.14;
    // model card: wide enough for the whole word
    const mu = MODEL_H / 3.9, mw = Math.max(MODEL_H, t.w * mu + 44);
    modelCv.style.width = mw + 'px'; modelCv.style.height = MODEL_H + 'px';
    mctx = prep(modelCv, mw, MODEL_H);
    L.mu = mu; L.mw = mw;
  }

  function repaint() {
    layout();
    drawBg();
    redrawInk();
    drawModel(0);
  }

  function line(c, pts, ox, oy, u, upto) {
    c.beginPath();
    c.moveTo(ox + pts[0][0] * u, oy + pts[0][1] * u);
    for (let i = 1; i < upto; i++) c.lineTo(ox + pts[i][0] * u, oy + pts[i][1] * u);
    c.stroke();
  }
  function disc(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }

  // Sky line, plane line, grass line, worm line
  function drawLines(c, x0, x1, oy, u, icons) {
    const rows = [['#60a5fa', 0.028, null, '☁️'], ['#93c5fd', 0.02, [0.12, 0.1], '✈️'], ['#22c55e', 0.036, null, '🌱'], ['#d6b98c', 0.018, [0.05, 0.1], '🪱']];
    c.save();
    rows.forEach((row, k) => {
      const y = oy + k * u;
      c.strokeStyle = row[0]; c.lineWidth = Math.max(1.5, row[1] * u);
      c.setLineDash(row[2] ? row[2].map(d => d * u) : []);
      c.beginPath(); c.moveTo(x0 + (icons ? u * 0.42 : 0), y); c.lineTo(x1, y); c.stroke();
      if (icons) {
        c.font = Math.round(clamp(u * 0.26, 16, 30)) + 'px system-ui, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(row[3], x0 + u * 0.2, y);
      }
    });
    c.restore();
  }

  function drawGuide(c, t, ox, oy, u, alpha) {
    c.save();
    c.globalAlpha = alpha;
    c.strokeStyle = c.fillStyle = '#d5dae6';
    c.lineWidth = GUIDE_W * u;
    t.strokes.forEach(s => {
      if (s.dot) disc(c, ox + s.pts[0][0] * u, oy + s.pts[0][1] * u, GUIDE_W * u * 0.62);
      else line(c, s.pts, ox, oy, u, s.pts.length);
    });
    c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(2, u * 0.022);
    c.setLineDash([u * 0.07, u * 0.1]);
    t.strokes.forEach(s => { if (!s.dot) line(c, s.pts, ox, oy, u, s.pts.length); });
    c.restore();
  }

  function drawBg() {
    bctx.clearRect(0, 0, L.W, L.H);
    drawLines(bctx, 14, L.W - 14, L.oy, L.u, true);
    if (cur.mode === 'trace') drawGuide(bctx, cur.t, L.ox, L.oy, L.u, 1);
    else if (cur.help) drawGuide(bctx, cur.t, L.ox, L.oy, L.u, 0.6);
  }

  // Draws the demo up to `el` ms; false once it has finished and faded
  function drawDemo(c, t, ox, oy, u, el, width, fadeOut) {
    const hold = 700, fade = 450;
    if (el < 0) return true;
    if (el > t.planEnd + hold + fade) return false;
    c.save();
    c.globalAlpha = fadeOut && el > t.planEnd + hold ? 1 - (el - t.planEnd - hold) / fade : 1;
    c.strokeStyle = c.fillStyle = '#a855f7';
    c.lineWidth = width * u;
    let tipAt = null;
    t.strokes.forEach((s, i) => {
      const f = clamp((el - t.plan[i].t0) / t.plan[i].d, 0, 1);
      if (f <= 0) return;
      if (s.dot) { disc(c, ox + s.pts[0][0] * u, oy + s.pts[0][1] * u, width * u * 0.75 * f); return; }
      const n = Math.max(2, Math.ceil(f * s.pts.length));
      line(c, s.pts, ox, oy, u, n);
      if (f < 1) tipAt = s.pts[n - 1];
    });
    if (tipAt) {
      c.fillStyle = '#ffffff'; disc(c, ox + tipAt[0] * u, oy + tipAt[1] * u, width * u * 0.95);
      c.fillStyle = '#7c3aed'; disc(c, ox + tipAt[0] * u, oy + tipAt[1] * u, width * u * 0.6);
    }
    c.restore();
    return true;
  }

  function drawModel(el) {
    if (!mctx || cur.mode === 'trace') return;
    const t = cur.t, u = L.mu, ox = (L.mw - t.w * u) / 2, oy = (MODEL_H - 3 * u) / 2 + 2;
    mctx.clearRect(0, 0, L.mw, MODEL_H);
    drawLines(mctx, 6, L.mw - 6, oy, u, false);
    mctx.strokeStyle = mctx.fillStyle = '#475569';
    mctx.lineWidth = u * 0.16;
    t.strokes.forEach(s => {
      if (s.dot) disc(mctx, ox + s.pts[0][0] * u, oy + s.pts[0][1] * u, u * 0.1);
      else line(mctx, s.pts, ox, oy, u, s.pts.length);
    });
    if (el > 0) return drawDemo(mctx, t, ox, oy, u, el, 0.2, true);
    return false;
  }

  function redrawInk() {
    ictx.clearRect(0, 0, L.W, L.H);
    const u = L.u, ox = L.ox, oy = L.oy, j = cur.judged;
    if (j) {
      // after checking: green where he was on the path, orange where he wandered
      let k = 0;
      ictx.lineWidth = u * 0.085;
      j.U.forEach(s => {
        if (s.length === 1) { ictx.fillStyle = j.on[k] ? '#16a34a' : '#f97316'; disc(ictx, ox + s[0][0] * u, oy + s[0][1] * u, u * 0.06); k++; return; }
        for (let i = 1; i < s.length; i++) {
          ictx.strokeStyle = j.on[k + i] ? '#16a34a' : '#f97316';
          ictx.beginPath();
          ictx.moveTo(ox + s[i - 1][0] * u, oy + s[i - 1][1] * u);
          ictx.lineTo(ox + s[i][0] * u, oy + s[i][1] * u);
          ictx.stroke();
        }
        k += s.length;
      });
      return;
    }
    ictx.strokeStyle = ictx.fillStyle = INK;
    cur.ink.forEach(s => {
      if (s.length === 1) { disc(ictx, ox + s[0][0] * u, oy + s[0][1] * u, s[0][2] * u * 0.7); return; }
      for (let i = 1; i < s.length; i++) inkSeg(s[i - 1], s[i]);
    });
  }
  function inkSeg(a, b) {
    ictx.lineWidth = (a[2] + b[2]) / 2 * L.u;
    ictx.beginPath();
    ictx.moveTo(L.ox + a[0] * L.u, L.oy + a[1] * L.u);
    ictx.lineTo(L.ox + b[0] * L.u, L.oy + b[1] * L.u);
    ictx.stroke();
  }

  // Animation loop for the fx layer
  function tick(now) {
    if (view !== 'play' || !cur) { raf = 0; return; }
    raf = requestAnimationFrame(tick);
    const c = fctx, t = cur.t, u = L.u, ox = L.ox, oy = L.oy;
    c.clearRect(0, 0, L.W, L.H);
    const beat = (now % 1100) / 1100;

    // the parts of the letter he left out, glowing
    const j = cur.judged;
    if (j && j.cov < 0.97) {
      c.save();
      c.globalAlpha = 0.55 + 0.35 * Math.sin(now / 160);
      c.strokeStyle = c.fillStyle = '#fbbf24';
      c.lineWidth = GUIDE_W * u * 0.8;
      const sx = ox + j.dx * u, sy = oy + j.dy * u;
      let k = 0;
      t.strokes.forEach(s => {
        if (s.dot) { if (!j.hit[k]) disc(c, sx + s.pts[0][0] * u, sy + s.pts[0][1] * u, GUIDE_W * u * 0.5); k++; return; }
        let from = -1;
        for (let i = 0; i <= s.pts.length; i++) {
          const miss = i < s.pts.length && !j.hit[k + i];
          if (miss && from < 0) from = i;
          if (!miss && from >= 0) {
            if (i - from >= 3) line(c, s.pts.slice(from, i), sx, sy, u, i - from);
            from = -1;
          }
        }
        k += s.pts.length;
      });
      c.restore();
    }

    // start dots: the next one to write pulses, finished ones disappear
    if ((cur.mode !== 'solo' || cur.help) && cur.state !== 'passed') {
      const n = t.strokes.length, writing = cur.state === 'writing';
      const first = writing ? Math.min(cur.done, n - 1) : 0;
      const numbered = !t.isWord && n > 1;
      for (let i = n - 1; i >= first; i--) {
        const s = t.strokes[i], x = ox + s.pts[0][0] * u, y = oy + s.pts[0][1] * u;
        const active = writing && i === first;
        const r = u * (active || !writing ? 0.105 : 0.085);
        c.save();
        c.globalAlpha = active || !writing ? 1 : 0.6;
        if (active) {
          c.fillStyle = 'rgba(34,197,94,' + (0.45 * (1 - beat)).toFixed(3) + ')';
          disc(c, x, y, r * (1.2 + 1.3 * beat));
        }
        // a little arrow: which way to go
        if (!s.dot && (cur.mode === 'trace' || cur.help) && s.pts.length > 14) {
          const a = s.pts[8], b = s.pts[13], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
          const ax = ox + b[0] * u, ay = oy + b[1] * u, h = u * 0.09;
          c.fillStyle = '#15803d';
          c.beginPath();
          c.moveTo(ax + Math.cos(ang) * h, ay + Math.sin(ang) * h);
          c.lineTo(ax + Math.cos(ang + 2.5) * h, ay + Math.sin(ang + 2.5) * h);
          c.lineTo(ax + Math.cos(ang - 2.5) * h, ay + Math.sin(ang - 2.5) * h);
          c.fill();
        }
        c.fillStyle = '#22c55e'; disc(c, x, y, r);
        c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(2, r * 0.22);
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
        if (numbered) {
          c.fillStyle = '#ffffff';
          c.font = '800 ' + Math.round(r * 1.35) + 'px ui-rounded, system-ui, sans-serif';
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(String(i + 1), x, y + r * 0.06);
        }
        c.restore();
      }
    }

    if (cur.demo && !drawDemo(c, t, ox, oy, u, now - cur.demo.t0, 0.13, true)) cur.demo = null;
    if (cur.mdemo) {
      const el = now - cur.mdemo.t0;
      if (el > 0 && !drawModel(el)) { cur.mdemo = null; drawModel(0); }
    }
  }

  // ── Pencil input ───────────────────────────────────────────────────────────
  // Apple Pencil arrives as pointerType "pen". Once a pencil has been seen,
  // fingers and the side of his hand are ignored so a resting palm can't draw.
  let penSeen = false, activeId = null, activeType = '', stroke = null, autoTimer = 0;

  function toUnits(e) {
    const pen = e.pointerType === 'pen';
    const w = pen ? 0.058 + 0.05 * clamp(e.pressure || 0.3, 0, 1) : 0.082;
    return [(e.clientX - L.left - L.ox) / L.u, (e.clientY - L.top - L.oy) / L.u, w];
  }

  function addPoint(e) {
    if (!stroke || stroke.length > 3000) return;
    const p = toUnits(e), last = stroke[stroke.length - 1];
    if (last) {
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) * L.u < 1.2) return;
      p[2] = last[2] + (p[2] - last[2]) * 0.35;      // ease pressure changes so the line doesn't flicker
      inkSeg(last, p);
    }
    stroke.push(p);
  }

  inkCv.addEventListener('pointerdown', e => {
    if (!cur) return;
    if (e.pointerType === 'pen') penSeen = true;
    else if (e.pointerType === 'touch' && penSeen) return;
    e.preventDefault();
    if (activeId !== null) {
      // his palm landed before the pencil tip: throw the palm mark away
      if (!(e.pointerType === 'pen' && activeType === 'touch')) return;
      cur.ink.pop();
      redrawInk();
    }
    if (cur.state === 'failed') resetAttempt();        // just start writing to try again
    if (cur.state !== 'writing') return;
    clearTimeout(autoTimer);
    audio();
    cur.demo = null;
    const r = paper.getBoundingClientRect();
    L.left = r.left; L.top = r.top;
    activeId = e.pointerId; activeType = e.pointerType;
    try { inkCv.setPointerCapture(e.pointerId); } catch (err) {}
    stroke = [];
    cur.ink.push(stroke);
    addPoint(e);
    ictx.strokeStyle = ictx.fillStyle = INK;
  });

  inkCv.addEventListener('pointermove', e => {
    if (e.pointerId !== activeId) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (evs && evs.length) evs.forEach(addPoint); else addPoint(e);
  });

  function endStroke(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    if (stroke && stroke.length === 1) disc(ictx, L.ox + stroke[0][0] * L.u, L.oy + stroke[0][1] * L.u, stroke[0][2] * L.u * 0.7);
    stroke = null;
    afterStroke();
  }
  inkCv.addEventListener('pointerup', endStroke);
  inkCv.addEventListener('pointercancel', endStroke);
  inkCv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  // After each stroke: move the pulsing dot on, then check it by itself (no
  // button needed) — a moment later if the whole letter is there, or once the
  // pencil has been still for a while if it isn't
  const DONE_MS = 1500, IDLE_MS = 5000;
  function afterStroke() {
    clearTimeout(autoTimer);
    if (!cur || cur.state !== 'writing') return;
    const t = cur.t, res = judge(t, cur.ink, cur.mode);
    if (res.empty) return;
    const need = new Array(t.strokes.length).fill(0), have = need.slice();
    for (let i = 0; i < t.ts.length; i++) { need[t.ts[i]]++; have[t.ts[i]] += res.hit[i]; }
    let done = 0;
    while (done < need.length && have[done] / need[done] >= 0.7) done++;
    cur.done = done;
    autoTimer = setTimeout(check, done === need.length && res.cov >= 0.9 ? DONE_MS : IDLE_MS);
  }

  // ── Round end ──────────────────────────────────────────────────────────────
  function drawThumb(c, x, y, w, h, key, ink) {
    const t = tpl(key), u = Math.min(h / 3.7, (w - 16) / Math.max(t.w, 0.6));
    const ox = x + (w - t.w * u) / 2, oy = y + (h - 3 * u) / 2;
    drawLines(c, x + 4, x + w - 4, oy, u, false);
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = c.fillStyle = INK; c.lineWidth = u * 0.1;
    (ink || []).forEach(s => {
      if (s.length === 1) disc(c, ox + s[0][0] * u, oy + s[0][1] * u, u * 0.07);
      else if (s.length) line(c, s, ox, oy, u, s.length);
    });
    c.restore();
  }

  let shareFile = null;
  const canShareFiles = (() => {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); } catch (e) { return false; }
  })();

  // One picture of everything he wrote this round, ready for the share sheet
  function buildShareImage(done) {
    shareFile = null;
    if (!canShareFiles || !done.length) return;
    const cw = 300, ch = 280, pad = 28, cols = Math.min(done.length, 4), rows = Math.ceil(done.length / cols);
    const cv = document.createElement('canvas');
    cv.width = pad + cols * (cw + pad); cv.height = 120 + rows * (ch + 56 + pad);
    const c = cv.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, cv.width, cv.height);
    c.fillStyle = INK; c.textBaseline = 'middle';
    c.font = '800 44px ui-rounded, system-ui, sans-serif';
    c.fillText('✏️ Leon’s writing', pad, 50);
    c.font = '600 22px ui-rounded, system-ui, sans-serif'; c.fillStyle = '#6b7280';
    c.fillText(new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }), pad, 94);
    done.forEach((it, i) => {
      const x = pad + (i % cols) * (cw + pad), y = 120 + Math.floor(i / cols) * (ch + 56 + pad);
      c.fillStyle = '#fffdf5'; c.fillRect(x, y, cw, ch);
      c.strokeStyle = '#fde68a'; c.lineWidth = 4; c.strokeRect(x, y, cw, ch);
      drawThumb(c, x, y, cw, ch, it.key, it.result.ink);
      c.font = '800 36px ui-rounded, system-ui, sans-serif'; c.textAlign = 'center';
      c.fillStyle = '#f59e0b'; c.fillText('★'.repeat(it.result.stars) + '☆'.repeat(3 - it.result.stars), x + cw / 2, y + ch + 30);
      c.textAlign = 'left';
    });
    cv.toBlob(blob => { if (blob) shareFile = new File([blob], 'leon-writing.png', { type: 'image/png' }); }, 'image/png');
  }

  function endRound() {
    const done = R.items.filter(it => it.result);
    const perfect = done.length === R.items.length && done.every(it => it.result.stars === 3);
    S.rounds++;
    save();
    cur = null;
    $('endEmoji').textContent = perfect ? '🏆' : '🎉';
    $('endStars').textContent = R.stars;
    const thumbs = $('thumbs');
    thumbs.innerHTML = '';
    done.forEach(it => {
      const t = tpl(it.key), h = 150, w = Math.max(130, Math.round(t.w * (h / 3.7) + 40));
      const card = document.createElement('div');
      card.className = 'thumb';
      const cv = document.createElement('canvas');
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
      const c = cv.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawThumb(c, 0, 0, w, h, it.key, it.result.ink);
      card.appendChild(cv);
      const st = document.createElement('div');
      st.className = 'st'; st.innerHTML = starsHtml(it.result.stars);
      card.appendChild(st);
      thumbs.appendChild(card);
    });
    buildShareImage(done);
    $('shareBtn').style.display = canShareFiles && done.length ? '' : 'none';
    show('end');
    if (perfect) { sfx.fanfare(); confetti(4); say(['perfect', 'win'], 400, { queue: true }); }
    else { sfx.great(); confetti(2); say('win', 400, { queue: true }); }
  }

  // ── Wiring ─────────────────────────────────────────────────────────────────
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    S.tab = b.dataset.tab; save(); sfx.tap();
    renderHome();
  });
  $('tiles').addEventListener('click', e => {
    const b = e.target.closest('[data-key]');
    if (b) startRound([b.dataset.key], true);
  });
  $('playBtn').onclick = () => startRound(buildRound(S.tab), false);
  $('muteBtn').onclick = () => {
    S.muted = !S.muted; save();
    if (S.muted) hush(); else sfx.tap();
    renderHome();
  };
  $('quitBtn').onclick = () => { clearTimeout(autoTimer); cur = null; goHome(); };
  $('model').onclick = () => { if (cur) { cur.mdemo = { t0: performance.now() }; sfx.tap(); } };
  $('tools').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || !cur) return;
    const act = b.dataset.act;
    if (act === 'check') check();
    else if (act === 'clear') { sfx.tap(); clearTimeout(autoTimer); cur.ink = []; cur.done = 0; redrawInk(); }
    else if (act === 'watch') { sfx.tap(); clearTimeout(autoTimer); playDemo(0); }
    else if (act === 'retry') { sfx.tap(); resetAttempt(); }
    else if (act === 'next') { sfx.tap(); next(); }
  });
  $('endHome').onclick = goHome;
  $('endAgain').onclick = () => { if (R.single) startRound([R.items[0].key], true); else startRound(buildRound(R.tab), false); };
  $('shareBtn').onclick = () => {
    if (shareFile && navigator.share) navigator.share({ files: [shareFile] }).catch(() => {});
  };

  // Keep the canvases matched to the paper whenever it changes size (rotation,
  // split view) — ink is stored in line units, so it redraws in the right place
  let resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (view !== 'play' || !cur || activeId !== null) return;
      const r = paper.getBoundingClientRect();
      if (Math.abs(r.width - L.W) > 0.5 || Math.abs(r.height - L.H) > 0.5) repaint();
    }, 120);
  }
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(paper);
  document.addEventListener('keydown', e => {
    if (view !== 'play' || !cur) return;
    if (e.key === 'Enter') { if (cur.state === 'writing') check(); else if (cur.state === 'passed') next(); else resetAttempt(); }
    else if (e.key === 'Backspace' && cur.state === 'writing') { cur.ink = []; cur.done = 0; redrawInk(); }
  });

  load();
  renderHome();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // For tuning the scoring from the console
  window.__hw = { GLYPHS: GLYPHS, tpl: tpl, judge: judge, start: (k) => startRound([k], true), cur: () => cur, layout: L, check: check, next: next, redraw: () => redrawInk() };
})();
</script>
</body>
</html>
